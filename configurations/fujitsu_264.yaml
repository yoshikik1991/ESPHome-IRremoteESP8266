# separate test file because it uses a different version of IRremoteESP8266

esphome:
  name: test-fujitsu-264

external_components:
  - source:
      type: local
      path: ../components

esp32:
  board: esp32dev
  framework:
    type: arduino

remote_transmitter:
  id: ir_led
  pin: 4
  carrier_duty_percent: 50%

# Plain config since this test file targets esp32dev, not an ESP32-S3 -- on
# an S3, longer frames (e.g. fujitsu-264's 33-byte/~266-symbol state frame)
# need use_dma: true plus rmt_symbols/receive_symbols: 512 (see README).
remote_receiver:
  id: ir_receiver
  pin: 5
  dump: []

climate:
  - platform: fujitsu_264
    id: my_fujitsu_264
    name: 'Fujitsu-264'
    # Enables receive mode (Fujitsu264Climate::on_receive()).
    receiver_id: ir_receiver

select:
  - platform: fujitsu_264
    fujitsu_264_id: my_fujitsu_264
    weak_dry:
      name: 'Weak dry'
    vertical_angle:
      name: 'Vertical angle'
    horizontal_angle:
      name: 'Horizontal angle'

number:
  - platform: fujitsu_264
    fujitsu_264_id: my_fujitsu_264
    temp_auto_offset:
      name: 'Auto mode temperature offset'

switch:
  - platform: fujitsu_264
    fujitsu_264_id: my_fujitsu_264
    internal_clean:
      name: 'Internal clean'

button:
  - platform: template
    name: 'Toggle powerful'
    on_press:
      then:
        - lambda: |-
            id(my_fujitsu_264).toggle_powerful();

  - platform: template
    name: 'Set fan angle'
    on_press:
      then:
        - lambda: |-
            id(my_fujitsu_264).set_fan_angle(1);

  - platform: template
    name: 'Toggle sterilization'
    on_press:
      then:
        - lambda: |-
            id(my_fujitsu_264).toggle_sterilization();
